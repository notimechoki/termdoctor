- id: syntax_error
  error: SyntaxError
  title: "Invalid Python syntax"
  explanation: "Python could not understand the code structure. This usually means there is a typo or a missing symbol near the reported line."
  causes:
    - "Missing colon after if, for, while, def, class, try, except, or else."
    - "Unclosed parentheses, brackets, braces, or quotes."
    - "Invalid operator or misplaced character."
  fixes:
    - "Check the reported file and line: {file_path}:{line_number}."
    - "Look at the line above the reported line too. Syntax errors are often caused by the previous line."
    - "Check missing colons, quotes, parentheses, and brackets."
  examples:
    - "if user == 'admin':"
    - "print('Hello')"

- id: indentation_error
  error: IndentationError
  title: "Incorrect indentation"
  explanation: "Python uses indentation to understand code blocks. This error means the indentation level is not valid."
  causes:
    - "A line is indented too much or too little."
    - "Tabs and spaces are mixed in the same file."
    - "Code inside if, for, while, def, or class is not indented correctly."
  fixes:
    - "Use 4 spaces per indentation level."
    - "Do not mix tabs and spaces."
    - "Check the block around {file_path}:{line_number}."

- id: module_not_found
  error: ModuleNotFoundError
  title: "Python cannot find a module"
  explanation: "Python tried to import `{module}`, but it is not available in the current environment."
  causes:
    - "The package is not installed in the Python environment used to run this command."
    - "The virtual environment is not activated."
    - "You are using a different Python interpreter."
    - "The import name may be different from the package name used for installation."
  fixes:
    - "Check the environment context shown by TermDoctor."
    - "Activate your project virtual environment if one exists."
    - "Install project dependencies from requirements.txt or pyproject.toml if they are available."
    - "If TermDoctor shows a package hint, install that package name instead of the import name."

- id: import_error
  error: ImportError
  title: "Import failed"
  explanation: "Python found the module, but could not import the requested object from it."
  causes:
    - "The imported name does not exist in that module."
    - "There is a circular import."
    - "The installed package version does not contain this object."
  fixes:
    - "Check the spelling of `{name}`."
    - "Open the module and verify that `{name}` is defined there."
    - "Check for circular imports between files."
    - "Check the installed package version."

- id: name_error
  error: NameError
  title: "A name is used before it exists"
  explanation: "Python found a variable, function, or class name that was not defined."
  causes:
    - "There is a typo in the name."
    - "The variable is used before assignment."
    - "The function or class was not imported."
    - "The name exists only inside another scope."
  fixes:
    - "Check the spelling of `{name}`."
    - "Make sure `{name}` is created before this line."
    - "Check imports."
    - "Check whether `{name}` is defined inside a function or block and unavailable here."

- id: type_error
  error: TypeError
  title: "Wrong value type or invalid operation"
  explanation: "Python received a value of the wrong type, or an operation was used with incompatible types."
  causes:
    - "A function received an argument of the wrong type."
    - "You tried to combine incompatible values, like string + integer."
    - "You called something that is not callable."
    - "A required argument is missing."
  fixes:
    - "Read the full error message carefully. TypeError usually describes exactly what type was expected."
    - "Print the type of the value with type(value)."
    - "Check function arguments."
    - "Convert values before using them, for example int(value) or str(value)."

- id: value_error
  error: ValueError
  title: "Correct type, invalid value"
  explanation: "Python received a value of the correct type, but the value itself is not acceptable."
  causes:
    - "A string cannot be converted to a number."
    - "A function received a value outside the allowed range."
    - "Data format is invalid."
  fixes:
    - "Check the value that caused the error."
    - "Validate user input before converting it."
    - "Add error handling with try/except if the value can be invalid."

- id: attribute_error
  error: AttributeError
  title: "Object does not have this attribute"
  explanation: "Python tried to access attribute `{attribute}`, but this object does not have it."
  causes:
    - "The object is not the type you expected."
    - "There is a typo in the attribute or method name."
    - "The value is None."
  fixes:
    - "Print the object type with type(value)."
    - "Check the spelling of `{attribute}`."
    - "Check whether the object is None before accessing attributes."
    - "Use dir(value) to inspect available attributes."

- id: key_error
  error: KeyError
  title: "Dictionary key does not exist"
  explanation: "Python tried to read key `{key}` from a dictionary, but that key does not exist."
  causes:
    - "The key name is misspelled."
    - "The dictionary has a different structure than expected."
    - "The key is optional and may be missing."
  fixes:
    - "Check the dictionary content before accessing `{key}`."
    - "Use dict.get('{key}') if the key may be optional."
    - "Check API response or JSON structure."
    - "Print dictionary keys with data.keys()."

- id: index_error
  error: IndexError
  title: "List index is out of range"
  explanation: "Python tried to access an item by index, but the list, tuple, or string does not have an item at that position."
  causes:
    - "The list is empty."
    - "The index is too large."
    - "The loop goes beyond the collection length."
  fixes:
    - "Check len(value) before accessing by index."
    - "Remember that Python indexes start from 0."
    - "Use a for item in items loop when possible."

- id: file_not_found
  error: FileNotFoundError
  title: "File or directory was not found"
  explanation: "Python tried to open `{path}`, but this file or directory does not exist."
  causes:
    - "The path is incorrect."
    - "The file is in another directory."
    - "The current working directory is different from what you expect."
  fixes:
    - "Check the path: {path}."
    - "Print the current directory with import os; print(os.getcwd())."
    - "Use an absolute path or build paths with pathlib.Path."
    - "Make sure the file exists before opening it."

- id: permission_error
  error: PermissionError
  title: "Permission denied"
  explanation: "Python tried to access a file, directory, or resource without enough permissions."
  causes:
    - "The file is protected."
    - "The current user does not have permission."
    - "The file is already used by another process."
  fixes:
    - "Check file permissions."
    - "Try another output directory."
    - "Do not run random scripts with sudo unless you fully trust them."

- id: zero_division_error
  error: ZeroDivisionError
  title: "Division by zero"
  explanation: "Python cannot divide a number by zero."
  causes:
    - "A divisor variable is 0."
    - "User input produced zero."
    - "A calculation returned zero unexpectedly."
  fixes:
    - "Check the divisor before division."
    - "Add a condition: if divisor != 0."
    - "Validate user input."

- id: recursion_error
  error: RecursionError
  title: "Maximum recursion depth exceeded"
  explanation: "A recursive function called itself too many times and did not stop in time."
  causes:
    - "The recursive function has no correct base case."
    - "The base case is never reached."
    - "The input is too large for recursion."
  fixes:
    - "Check the base case."
    - "Print arguments on each recursive call to see why it does not stop."
    - "Consider rewriting the logic with a loop."

- id: unicode_decode_error
  error: UnicodeDecodeError
  title: "Text decoding failed"
  explanation: "Python tried to read bytes as text, but the selected encoding could not decode them."
  causes:
    - "The file is not UTF-8."
    - "The file contains invalid characters for the selected encoding."
    - "You opened a binary file as text."
  fixes:
    - "Try specifying encoding='utf-8'."
    - "If the file is not UTF-8, use the correct encoding."
    - "Open binary files with mode='rb'."

- id: json_decode_error
  error: JSONDecodeError
  title: "Invalid JSON"
  explanation: "Python tried to parse JSON, but the text is not valid JSON."
  causes:
    - "The JSON string is empty."
    - "The JSON has trailing commas."
    - "Quotes are missing around keys or string values."
    - "The response is HTML or plain text, not JSON."
  fixes:
    - "Print the raw JSON text before parsing."
    - "Validate the JSON in a JSON formatter."
    - "Check whether the API returned an error page instead of JSON."

- id: unbound_local_error
  error: UnboundLocalError
  title: "Local variable is used before assignment"
  explanation: "Python treats `{name}` as a local variable inside the function, but the code tries to use it before assigning a value."
  causes:
    - "A variable is assigned somewhere inside a function, so Python considers it local."
    - "The variable is read before the assignment happens."
    - "You expected to use a global variable, but Python created a local scope."
  fixes:
    - "Assign `{name}` before reading it."
    - "Pass `{name}` as a function argument instead of relying on outer scope."
    - "Avoid changing a global variable inside a function unless you really need to."
    - "If you intentionally need a global variable, use the global keyword carefully."

- id: assertion_error
  error: AssertionError
  title: "Assertion failed"
  explanation: "An assert statement or test assertion expected something to be true, but it was false."
  causes:
    - "The actual value does not match the expected value."
    - "A test condition is wrong."
    - "The code under test returned an unexpected result."
  fixes:
    - "Check the assertion condition."
    - "Print or inspect the actual value before the assertion."
    - "If this happened in a test, compare expected and actual values."
    - "Make sure the input data matches what the assertion expects."

- id: runtime_error
  error: RuntimeError
  title: "Runtime error"
  explanation: "Python detected a problem while the program was running. RuntimeError is often raised when the operation is not allowed in the current state."
  causes:
    - "The program reached an invalid state."
    - "A library raised RuntimeError for a framework-specific reason."
    - "An async/event loop operation was used incorrectly."
  fixes:
    - "Read the full error message carefully. RuntimeError usually explains the specific condition."
    - "Check the code around {file_path}:{line_number}."
    - "If a framework is involved, check whether the operation is allowed at that point."
    - "Search for the exact RuntimeError message in the library documentation."

- id: os_error
  error: OSError
  title: "Operating system error"
  explanation: "Python asked the operating system to do something, but the OS could not complete the operation."
  causes:
    - "A file, directory, permission, device, or network resource is unavailable."
    - "The path is invalid."
    - "The process does not have enough permissions."
  fixes:
    - "Check the full error message for the OS-level reason."
    - "Check paths, permissions, and whether the resource exists."
    - "If this is a network operation, check connectivity and host/port values."

- id: is_a_directory_error
  error: IsADirectoryError
  title: "Expected a file, got a directory"
  explanation: "Python expected a file path, but `{path}` points to a directory."
  causes:
    - "You passed a directory path to a function that expects a file."
    - "The file name is missing from the path."
    - "The path variable contains the wrong value."
  fixes:
    - "Pass a full file path, not just a directory path."
    - "Check the value of the path variable."
    - "If you want to read files from a directory, iterate through the directory contents first."

- id: not_a_directory_error
  error: NotADirectoryError
  title: "Expected a directory, got a file"
  explanation: "Python expected part of the path to be a directory, but it found a file instead."
  causes:
    - "A path segment points to a file when Python expected a folder."
    - "The path was built incorrectly."
    - "A file and directory have conflicting names."
  fixes:
    - "Check every part of the path."
    - "Print the path before using it."
    - "Make sure parent folders exist and are actually directories."

- id: eof_error
  error: EOFError
  title: "Input ended unexpectedly"
  explanation: "Python expected input, but reached the end of input instead."
  causes:
    - "input() was called when no input was available."
    - "The program is running in a non-interactive environment."
    - "A file or stream ended earlier than expected."
  fixes:
    - "Do not call input() unless the user can actually type something."
    - "Provide input through stdin if the script expects it."
    - "Handle EOFError with try/except when input may be missing."

- id: connection_error
  error: ConnectionError
  title: "Network connection failed"
  explanation: "Python could not complete a network connection."
  causes:
    - "The server is down or unreachable."
    - "The host or port is incorrect."
    - "The network connection is blocked or unstable."
  fixes:
    - "Check the URL, host, and port."
    - "Check whether the target service is running."
    - "Retry the request after confirming network connectivity."
    - "Add timeout and error handling for network calls."

- id: timeout_error
  error: TimeoutError
  title: "Operation timed out"
  explanation: "An operation took too long and Python stopped waiting for it."
  causes:
    - "A network request is too slow."
    - "A service is not responding."
    - "A file, socket, or process operation is blocked."
  fixes:
    - "Check whether the external service is available."
    - "Increase the timeout only if the operation is expected to take longer."
    - "Add retry logic if this is a network request."
    - "Handle TimeoutError with try/except."

- id: broken_pipe_error
  error: BrokenPipeError
  title: "Broken pipe"
  explanation: "Python tried to write data to a pipe or connection that was already closed by the other side."
  causes:
    - "The receiving process closed before Python finished writing."
    - "Output was piped to a command that stopped early."
    - "A network socket was closed."
  fixes:
    - "Check the command or process receiving the output."
    - "Handle BrokenPipeError if writing to pipes or sockets."
    - "Avoid writing after the connection is closed."

- id: memory_error
  error: MemoryError
  title: "Not enough memory"
  explanation: "Python could not allocate enough memory for the operation."
  causes:
    - "The program is loading too much data into memory."
    - "A loop or recursion is creating too many objects."
    - "The machine does not have enough available RAM."
  fixes:
    - "Process data in smaller chunks."
    - "Avoid loading huge files completely into memory."
    - "Check for infinite loops or uncontrolled list growth."
    - "Use generators or streaming when possible."

- id: tab_error
  error: TabError
  title: "Tabs and spaces are mixed"
  explanation: "Python found inconsistent indentation because tabs and spaces are mixed in the same block."
  causes:
    - "Some lines use tabs while nearby lines use spaces."
    - "The editor displays tabs like spaces, hiding the mismatch."
    - "Code was copied from another file or web page."
  fixes:
    - "Convert indentation in the file to spaces."
    - "Use 4 spaces per indentation level."
    - "Enable visible whitespace in your editor and check the block around {file_path}:{line_number}."

- id: lookup_error
  error: LookupError
  title: "Lookup failed"
  explanation: "Python could not find an item in a collection or registry. More specific forms include KeyError and IndexError."
  causes:
    - "A dictionary key, sequence index, codec, or registry entry is missing."
    - "The data structure does not contain the expected value."
    - "Input data has a different shape than the code expects."
  fixes:
    - "Inspect the value being searched before the failing line."
    - "Check available keys, indexes, or registered names."
    - "Handle missing values explicitly when they are valid input."

- id: arithmetic_error
  error: ArithmeticError
  title: "Arithmetic operation failed"
  explanation: "A numeric operation failed. More specific forms include ZeroDivisionError, OverflowError, and FloatingPointError."
  causes:
    - "A calculation used invalid or extreme numeric values."
    - "A divisor, exponent, or conversion produced an invalid result."
    - "A numeric library raised a generic arithmetic exception."
  fixes:
    - "Check the numeric inputs before the operation."
    - "Guard division, exponentiation, and conversions with validation."
    - "If this comes from a numeric library, inspect the exact values passed to it."

- id: overflow_error
  error: OverflowError
  title: "Number is too large"
  explanation: "A numeric result is too large for Python or an underlying C/library operation to represent."
  causes:
    - "A very large exponent, factorial, timestamp, or conversion was used."
    - "A float operation exceeded the representable range."
    - "A library function has a smaller numeric limit than Python integers."
  fixes:
    - "Check the size of the input values."
    - "Use Decimal or integer-safe logic when appropriate."
    - "Clamp or validate user input before expensive numeric operations."

- id: floating_point_error
  error: FloatingPointError
  title: "Floating point operation failed"
  explanation: "A floating point operation raised an error, often because strict numeric error handling is enabled."
  causes:
    - "The operation produced divide-by-zero, overflow, underflow, or invalid floating point output."
    - "A library such as NumPy is configured to raise on floating point warnings."
    - "Input arrays contain NaN, infinity, or invalid values."
  fixes:
    - "Inspect inputs for NaN and infinity."
    - "Guard divide-by-zero and invalid operations."
    - "For NumPy, check numpy.seterr and clean data before calculations."

- id: reference_error
  error: ReferenceError
  title: "Weak reference target is gone"
  explanation: "Python tried to use an object through a weak reference after the original object was already garbage collected."
  causes:
    - "Only weak references to the object remain."
    - "A cache or callback stores weak references but no strong owner keeps the object alive."
    - "Object lifetime is shorter than expected."
  fixes:
    - "Keep a strong reference to the object while it is needed."
    - "Check cache, signal, or callback ownership."
    - "Handle missing weak-reference targets gracefully."

- id: environment_error
  error: EnvironmentError
  title: "Environment or OS operation failed"
  explanation: "An environment-level operation failed. In modern Python this is usually the same family as OSError."
  causes:
    - "A file, directory, permission, device, process, or network resource is unavailable."
    - "The current environment is missing required variables or access."
    - "The operation depends on OS state that changed."
  fixes:
    - "Read the exact OS message and errno."
    - "Check paths, permissions, environment variables, and current working directory."
    - "Prefer handling the more specific OSError subclass if available."

- id: io_error
  error: IOError
  title: "Input/output operation failed"
  explanation: "Python could not complete a read, write, or stream operation. In modern Python IOError is an alias of OSError."
  causes:
    - "A file path is wrong or unavailable."
    - "A device, pipe, or network stream closed unexpectedly."
    - "Permissions or disk space prevent the operation."
  fixes:
    - "Check the path, stream, and permissions."
    - "Verify that the file or device is available before using it."
    - "Handle partial reads/writes and closed streams when working with external resources."

- id: filesystem_exists_error
  error: FileExistsError
  title: "File or directory already exists"
  explanation: "Python tried to create a file or directory, but something already exists at that path."
  causes:
    - "mkdir, open with exclusive mode, or a similar create operation hit an existing path."
    - "The code assumes it is running in an empty output directory."
    - "A previous run already created the file."
  fixes:
    - "Check whether the path should be reused, overwritten, or skipped."
    - "Use exist_ok=True with pathlib.Path.mkdir only when reusing a directory is valid."
    - "Generate unique output names when repeated runs are expected."

- id: process_lookup_error
  error: ProcessLookupError
  title: "Process does not exist"
  explanation: "Python tried to operate on a process ID that does not exist anymore."
  causes:
    - "The process already exited."
    - "The PID is stale or belongs to another environment."
    - "A subprocess was reaped before later code tried to inspect it."
  fixes:
    - "Check whether the process is still running before signaling it."
    - "Store subprocess objects instead of only raw PIDs when possible."
    - "Handle the case where a process exits between checks."

- id: child_process_error
  error: ChildProcessError
  title: "Child process operation failed"
  explanation: "Python could not complete an operation related to a child process."
  causes:
    - "The child process has already been waited for."
    - "The process is not a child of the current process."
    - "Subprocess lifecycle is being managed twice."
  fixes:
    - "Use subprocess.run for simple commands."
    - "Call wait or communicate once per subprocess."
    - "Keep process lifecycle handling in one place."

- id: interrupted_error
  error: InterruptedError
  title: "System call was interrupted"
  explanation: "An OS-level operation was interrupted before it completed."
  causes:
    - "A signal interrupted a blocking file, socket, or process operation."
    - "The code interacts with low-level OS APIs."
    - "The operation may need to be retried."
  fixes:
    - "Retry the operation if it is safe to do so."
    - "Check signal handlers and timeout logic."
    - "Use higher-level APIs when possible."

- id: blocking_io_error
  error: BlockingIOError
  title: "Non-blocking operation would block"
  explanation: "A non-blocking file descriptor, socket, or stream operation could not proceed immediately."
  causes:
    - "The resource is in non-blocking mode."
    - "No data is available to read yet, or the write buffer is full."
    - "Async or selector code is missing readiness checks."
  fixes:
    - "Wait until the resource is ready before reading or writing."
    - "Use selectors, asyncio, or proper polling for non-blocking IO."
    - "Handle BlockingIOError as a normal retry condition in non-blocking code."

- id: not_implemented_error
  error: NotImplementedError
  title: "Code path is not implemented"
  explanation: "The program reached a method or branch that is intentionally left unimplemented."
  causes:
    - "An abstract method was not overridden."
    - "A placeholder implementation was called in production code."
    - "A subclass does not implement the required interface."
  fixes:
    - "Implement the missing method or branch."
    - "Check whether the correct subclass or strategy object is being used."
    - "Remove placeholder raises once the feature is complete."

- id: system_error
  error: SystemError
  title: "Internal interpreter or extension error"
  explanation: "Python or a native extension reported an internal error. This is uncommon in normal pure-Python code."
  causes:
    - "A C extension, binary wheel, or interpreter edge case failed."
    - "Package versions are incompatible with the Python version."
    - "Native dependencies are corrupted or mismatched."
  fixes:
    - "Check the package and Python versions involved."
    - "Reinstall or upgrade the package that appears in the traceback."
    - "If this is reproducible, search the package issue tracker with the exact message."

- id: system_exit
  error: SystemExit
  title: "Program requested exit"
  explanation: "The program called sys.exit, argparse/typer exited after CLI parsing, or a framework intentionally stopped execution."
  causes:
    - "A CLI command received invalid arguments."
    - "The code called sys.exit directly."
    - "A test invoked code that exits the process."
  fixes:
    - "Check the exit code and message."
    - "For tests, assert SystemExit or call the function below the CLI layer."
    - "Avoid sys.exit in reusable library code."

- id: keyboard_interrupt
  error: KeyboardInterrupt
  title: "Program was interrupted"
  explanation: "The running Python process received an interrupt, usually from Ctrl+C."
  causes:
    - "The user interrupted the command."
    - "A terminal, IDE, or process manager sent an interrupt signal."
    - "The program was taking too long or waiting indefinitely."
  fixes:
    - "Rerun the command if the interrupt was accidental."
    - "Check for long-running loops, blocking input, or slow network calls."
    - "Handle KeyboardInterrupt only when cleanup is needed."

- id: generator_exit
  error: GeneratorExit
  title: "Generator was closed"
  explanation: "A generator or coroutine was closed while it was still running."
  causes:
    - "The generator was garbage collected or explicitly closed."
    - "A yield happened while the generator was closing."
    - "Async generator cleanup is doing work that is not allowed during close."
  fixes:
    - "Keep generator cleanup simple and final."
    - "Do not yield from a generator while handling GeneratorExit."
    - "Check async generator lifecycle and cancellation handling."

- id: stop_iteration
  error: StopIteration
  title: "Iterator has no more values"
  explanation: "next() was called on an iterator that is already exhausted."
  causes:
    - "The iterator is empty."
    - "The code called next() without a default value."
    - "A generator returned before yielding another value."
  fixes:
    - "Use a for loop when possible."
    - "Call next(iterator, default) if an empty iterator is valid."
    - "Check why the iterable has fewer items than expected."

- id: stop_async_iteration
  error: StopAsyncIteration
  title: "Async iterator has no more values"
  explanation: "An async iterator finished and has no more values to produce."
  causes:
    - "The async iterator is empty."
    - "anext() was called without a default value."
    - "Async generator logic returned earlier than expected."
  fixes:
    - "Use async for when possible."
    - "Call anext(iterator, default) if an empty async iterator is valid."
    - "Check async generator conditions and data source availability."

- id: exception_group
  error: ExceptionGroup
  title: "Multiple exceptions happened together"
  explanation: "Python grouped multiple exceptions into one ExceptionGroup, often from task groups or concurrent code."
  causes:
    - "Several async tasks failed at the same time."
    - "Concurrent code collected multiple errors before raising."
    - "Only the group header was inspected, not the nested exceptions."
  fixes:
    - "Expand the traceback and read each nested exception."
    - "Fix the innermost specific errors first."
    - "Use except* handlers when you need to handle grouped exception types separately."

- id: base_exception_group
  error: BaseExceptionGroup
  title: "Grouped base exceptions"
  explanation: "Python grouped multiple BaseException instances. This is similar to ExceptionGroup but can include non-Exception base exceptions."
  causes:
    - "Concurrent tasks raised several failures."
    - "Cancellation or system-level exceptions were grouped."
    - "Nested traceback details are being overlooked."
  fixes:
    - "Inspect the nested exceptions inside the group."
    - "Handle specific grouped types with except* where appropriate."
    - "Check task group cancellation and cleanup logic."

- id: async_cancelled_error
  error: CancelledError
  match:
    - "asyncio.exceptions.CancelledError"
    - "concurrent.futures._base.CancelledError"
    - "CancelledError"
  title: "Async task or future was cancelled"
  explanation: "An asyncio task or future was cancelled before it completed."
  causes:
    - "A timeout cancelled the task."
    - "A parent task, TaskGroup, or event loop shutdown cancelled pending work."
    - "The code caught broad exceptions and did not account for cancellation semantics."
  fixes:
    - "Find who calls cancel() or where the timeout is applied."
    - "Let CancelledError propagate after cleanup unless you intentionally suppress it."
    - "Use try/finally for cleanup around async work."

- id: async_timeout_error
  error: TimeoutError
  match:
    - "asyncio.exceptions.TimeoutError"
