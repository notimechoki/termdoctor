syntax_error:
  title: Некорректный синтаксис Python
  explanation: Python не смог разобрать структуру кода. Обычно рядом с указанной строкой есть опечатка или пропущенный
    символ.
  causes:
  - После if, for, while, def, class, try, except или else пропущено двоеточие.
  - Не закрыты круглые, квадратные или фигурные скобки либо кавычки.
  - Использован неверный оператор или символ стоит не на своём месте.
  fixes:
  - 'Проверьте файл и строку: {file_path}:{line_number}.'
  - 'Посмотрите также строку выше: синтаксическая ошибка часто вызвана предыдущей строкой.'
  - Проверьте двоеточия, кавычки и все виды скобок.
indentation_error:
  title: Некорректные отступы
  explanation: Python использует отступы для определения блоков кода. Уровень отступа в этом месте недопустим.
  causes:
  - Строка сдвинута слишком сильно или недостаточно.
  - В одном файле смешаны табуляции и пробелы.
  - Код внутри if, for, while, def или class выровнен неправильно.
  fixes:
  - Используйте 4 пробела на один уровень отступа.
  - Не смешивайте табуляции и пробелы.
  - Проверьте блок около {file_path}:{line_number}.
module_not_found:
  title: Python не может найти модуль
  explanation: Python попытался импортировать `{module}`, но этот модуль недоступен в текущем окружении.
  causes:
  - Пакет не установлен в том окружении Python, которым запущена команда.
  - Виртуальное окружение не активировано.
  - Используется другой интерпретатор Python.
  - Имя импорта отличается от имени пакета для установки.
  fixes:
  - Проверьте контекст окружения, показанный TermDoctor.
  - Активируйте виртуальное окружение проекта, если оно существует.
  - Установите зависимости проекта из requirements-файлов или pyproject.toml.
  - Если TermDoctor показывает подсказку по пакету, устанавливайте это имя, а не имя импорта.
import_error_circular:
  title: Циклический импорт помешал инициализации
  explanation: Два или больше модулей импортируют друг друга до того, как их определения успевают полностью создаться.
  causes:
  - module_a импортирует module_b, а module_b одновременно импортирует module_a.
  - Файл проекта называется так же, как установленный пакет.
  - Общие модели или константы находятся в модулях, которые зависят друг от друга.
  fixes:
  - Вынесите общие константы, модели или интерфейсы в отдельный модуль.
  - Импорт внутри функции можно использовать только как временный способ разорвать цикл.
  - Переименуйте локальные файлы, перекрывающие сторонние модули или стандартную библиотеку.
import_error:
  title: Не удалось выполнить импорт
  explanation: Python нашёл модуль, но не смог импортировать из него запрошенный объект.
  causes:
  - Импортируемого имени в модуле нет.
  - Возник циклический импорт.
  - Установленная версия пакета не содержит этот объект.
  fixes:
  - Проверьте написание `{name}`.
  - Откройте модуль и убедитесь, что `{name}` действительно определён.
  - Проверьте файлы на циклические импорты.
  - Проверьте установленную версию пакета.
name_error:
  title: Имя используется до объявления
  explanation: Python встретил имя переменной, функции или класса, которое не было определено.
  causes:
  - В имени есть опечатка.
  - Переменная используется до присваивания.
  - Функция или класс не импортированы.
  - Имя существует только в другой области видимости.
  fixes:
  - Проверьте написание `{name}`.
  - Убедитесь, что `{name}` создаётся до этой строки.
  - Проверьте импорты.
  - Проверьте, не объявлено ли `{name}` внутри функции или блока и потому недоступно здесь.
type_error_missing_argument:
  title: Не передан обязательный аргумент функции
  explanation: Функция или метод вызваны без одного или нескольких обязательных аргументов. В сообщении указано
    имя аргумента или количество недостающих позиционных аргументов.
  causes:
  - Пропущен обязательный позиционный аргумент.
  - Метод вызван у класса вместо экземпляра или наоборот.
  - Сигнатура callback-функции не соответствует требованиям фреймворка.
  fixes:
  - Сравните вызов с определением функции и передайте все обязательные аргументы.
  - Проверьте, должен ли первым параметром быть self или cls.
  - Найдите точное имя аргумента в сообщении и исправьте место вызова.
type_error_unexpected_keyword:
  title: Передан неожиданный именованный аргумент
  explanation: Функция вызвана с именованным аргументом, которого нет в её текущей сигнатуре.
  causes:
  - Имя аргумента написано с ошибкой.
  - В установленной версии библиотеки параметр называется иначе.
  - Обёртка передаёт неподдерживаемый именованный аргумент.
  fixes:
  - Посмотрите сигнатуру функции и используйте поддерживаемое имя параметра.
  - Проверьте версию пакета и документацию к ней.
  - Удалите или переименуйте неподдерживаемый аргумент.
type_error_not_callable:
  title: Вызван объект, который не является функцией
  explanation: Код использовал круглые скобки так, будто значение можно вызвать, но этот объект не поддерживает
    вызов.
  causes:
  - Имя функции было перезаписано строкой, числом, списком или другим значением.
  - Круглые скобки использованы вместо индексации или обращения к атрибуту.
  - Свойство объекта ошибочно принято за метод.
  fixes:
  - Выведите type(value) прямо перед проблемным вызовом.
  - Проверьте, не было ли имя функции переопределено ранее.
  - Уберите скобки, если это свойство, либо вызовите правильный метод.
type_error_not_subscriptable:
  title: Объект не поддерживает индексацию
  explanation: Код использовал квадратные скобки для значения, которое не поддерживает доступ по индексу или ключу.
  causes:
  - Вместо списка или словаря значение равно None.
  - Функцию или метод индексируют вместо вызова.
  - Тип объекта не реализует доступ через квадратные скобки.
  fixes:
  - Выведите значение и type(value) перед проблемной строкой.
  - Проверьте, не нужны ли круглые скобки () перед квадратными [].
  - Убедитесь, что значение не равно None и имеет ожидаемый тип коллекции.
type_error_not_iterable:
  title: Объект нельзя перебрать
  explanation: Python ожидал значение, по которому можно пройти циклом или которое можно распаковать, но получил
    неитерируемый объект.
  causes:
  - Цикл получил None, число или другое одиночное значение.
  - Функция вернула одно значение вместо коллекции.
  - Код пытается распаковать объект, который нельзя перебирать.
  fixes:
  - Выведите type(value) и проверьте результат функции.
  - Возвращайте список, кортеж, генератор или другой итерируемый объект.
  - Обрабатывайте None отдельно до цикла или распаковки.
type_error_unsupported_operand:
  title: Типы операндов несовместимы
  explanation: Оператор применён к значениям, типы которых нельзя объединить этой операцией.
  causes:
  - Строка и число объединяются без преобразования.
  - Один из операндов равен None.
  - Пользовательский класс не реализует нужный оператор.
  fixes:
  - Проверьте оба операнда через type(left) и type(right).
  - Явно преобразуйте значения перед операцией.
  - Проверяйте необязательные значения, чтобы None не попадал в вычисление.
type_error_multiple_values:
  title: Аргумент получил несколько значений
  explanation: Один и тот же аргумент функции передан больше одного раза, обычно одновременно позиционно и по имени.
  causes:
  - Позиционный аргумент уже заполнил параметр, который затем передали по имени.
  - Словарь, развёрнутый через **kwargs, содержит повторяющийся ключ.
  - Обёртка добавляет аргумент, который уже передал вызывающий код.
  fixes:
  - Передавайте аргумент только один раз.
  - Проверьте содержимое **kwargs перед передачей.
  - Сравните порядок позиционных аргументов с сигнатурой функции.
type_error:
  title: Неверный тип значения или недопустимая операция
  explanation: Python получил значение неправильного типа либо операция применена к несовместимым типам.
  causes:
  - Функция получила аргумент неправильного типа.
  - Код пытается объединить несовместимые значения, например строку и число.
  - Вызван объект, который нельзя вызвать.
  - Не передан обязательный аргумент.
  fixes:
  - 'Внимательно прочитайте полное сообщение: TypeError обычно прямо указывает ожидаемый тип.'
  - Выведите тип значения через type(value).
  - Проверьте аргументы функции.
  - Преобразуйте значения перед использованием, например int(value) или str(value).
value_error_invalid_literal:
  title: Строку нельзя преобразовать в нужное число
  explanation: Python попытался преобразовать текст в числовой тип, но текст не соответствует требуемому формату.
  causes:
  - Ввод содержит буквы, пробелы или знаки пунктуации.
  - Система счисления не соответствует переданному тексту.
  - В int() или float() передана пустая строка.
  fixes:
  - Перед преобразованием выведите или запишите repr(value).
  - Уберите пробелы по краям и проверьте формат.
  - Обрабатывайте неверный пользовательский ввод через try/except ValueError.
value_error:
  title: Тип правильный, но значение недопустимо
  explanation: Python получил значение подходящего типа, но само значение нельзя использовать в этой операции.
  causes:
  - Строку невозможно преобразовать в число.
  - Функция получила значение вне допустимого диапазона.
  - Формат данных неверен.
  fixes:
  - Проверьте значение, вызвавшее ошибку.
  - Проверяйте пользовательский ввод до преобразования.
  - Добавьте try/except, если значение может быть некорректным.
attribute_error_none:
  title: Получено None вместо ожидаемого объекта
  explanation: Код попытался обратиться к атрибуту у None. Обычно предыдущий поиск или вызов функции не вернул объект.
  causes:
  - Функция неявно вернула None.
  - Поиск в базе данных или коллекции не нашёл результат.
  - Необязательное значение использовано без проверки.
  fixes:
  - Проследите, где присваивается значение, и проверьте результат функции.
  - Проверяйте None до обращения к атрибуту.
  - Выдавайте понятную ошибку или используйте запасное значение, когда объект отсутствует.
attribute_error:
  title: У объекта нет такого атрибута
  explanation: Python попытался обратиться к атрибуту `{attribute}`, которого у этого объекта нет.
  causes:
  - Объект имеет не тот тип, который ожидался.
  - В имени атрибута или метода есть опечатка.
  - Значение равно None.
  fixes:
  - Выведите тип объекта через type(value).
  - Проверьте написание `{attribute}`.
  - Проверьте, не равен ли объект None.
  - Используйте dir(value), чтобы посмотреть доступные атрибуты.
key_error:
  title: Ключ словаря не существует
  explanation: Python попытался прочитать ключ `{key}` из словаря, но такого ключа нет.
  causes:
  - Имя ключа написано с ошибкой.
  - Структура словаря отличается от ожидаемой.
  - Ключ необязательный и может отсутствовать.
  fixes:
  - Проверьте содержимое словаря перед обращением к `{key}`.
  - Используйте dict.get('{key}'), если ключ может отсутствовать.
  - Проверьте структуру ответа API или JSON.
  - Выведите ключи через data.keys().
index_error:
  title: Индекс выходит за границы коллекции
  explanation: Python попытался получить элемент по индексу, которого нет в списке, кортеже или строке.
  causes:
  - Список пуст.
  - Индекс слишком большой.
  - Цикл выходит за длину коллекции.
  fixes:
  - Проверяйте len(value) перед обращением по индексу.
  - Помните, что индексы Python начинаются с 0.
  - Когда возможно, используйте цикл for item in items.
file_not_found:
  title: Файл или папка не найдены
  explanation: Python попытался открыть `{path}`, но такого файла или каталога не существует.
  causes:
  - Путь указан неверно.
  - Файл находится в другой папке.
  - Текущая рабочая папка отличается от ожидаемой.
  fixes:
  - 'Проверьте путь: {path}.'
  - 'Выведите текущую папку: import os; print(os.getcwd()).'
  - Используйте абсолютный путь или pathlib.Path.
  - Убедитесь, что файл существует до открытия.
permission_error:
  title: Недостаточно прав доступа
  explanation: Python попытался обратиться к файлу, каталогу или ресурсу без необходимых разрешений.
  causes:
  - Файл защищён.
  - У текущего пользователя нет прав.
  - Файл уже занят другим процессом.
  fixes:
  - Проверьте права на файл или папку.
  - Попробуйте другую папку для вывода.
  - Не запускайте случайные скрипты через sudo, если полностью им не доверяете.
zero_division_error:
  title: Деление на ноль
  explanation: Python не может делить число на ноль.
  causes:
  - Переменная-делитель равна 0.
  - Пользователь ввёл ноль.
  - Вычисление неожиданно вернуло ноль.
  fixes:
  - Проверяйте делитель до операции.
  - Добавьте условие if divisor != 0.
  - Проверяйте пользовательский ввод.
recursion_error:
  title: Превышена максимальная глубина рекурсии
  explanation: Рекурсивная функция вызвала себя слишком много раз и не остановилась вовремя.
  causes:
  - У функции нет корректного базового случая.
  - Базовый случай никогда не достигается.
  - Входные данные слишком велики для рекурсивного решения.
  fixes:
  - Проверьте базовый случай.
  - Выводите аргументы каждого рекурсивного вызова, чтобы понять, почему функция не останавливается.
  - Рассмотрите замену рекурсии циклом.
unicode_decode_error:
  title: Не удалось декодировать текст
  explanation: Python попытался прочитать байты как текст, но выбранная кодировка не смогла их декодировать.
  causes:
  - Файл сохранён не в UTF-8.
  - Файл содержит символы, недопустимые для выбранной кодировки.
  - Бинарный файл открыт как текстовый.
  fixes:
  - Попробуйте явно указать encoding='utf-8'.
  - Если файл не в UTF-8, используйте его реальную кодировку.
  - Открывайте бинарные файлы в режиме 'rb'.
json_decode_error:
  title: Некорректный JSON
  explanation: Python попытался разобрать JSON, но переданный текст не является корректным JSON.
  causes:
  - Строка JSON пустая.
  - В JSON есть лишние запятые.
  - Ключи или строковые значения не заключены в кавычки.
  - Ответ содержит HTML или обычный текст вместо JSON.
  fixes:
  - Выведите исходный текст до парсинга.
  - Проверьте JSON в валидаторе или форматтере.
  - Убедитесь, что API не вернул страницу ошибки вместо JSON.
unbound_local_error:
  title: Локальная переменная используется до присваивания
  explanation: Python считает `{name}` локальной переменной функции, но код пытается прочитать её до присваивания
    значения.
  causes:
  - Переменной что-то присваивается внутри функции, поэтому Python считает её локальной.
  - Переменная читается раньше, чем выполняется присваивание.
  - Код ожидал глобальную переменную, но попал в локальную область видимости.
  fixes:
  - Присвойте `{name}` значение до чтения.
  - Передавайте `{name}` аргументом функции вместо зависимости от внешней области.
  - Не изменяйте глобальные переменные внутри функций без необходимости.
  - Если глобальная переменная действительно нужна, осторожно используйте global.
assertion_error:
  title: Проверка assert не выполнена
  explanation: Выражение assert или проверка в тесте ожидали истинное условие, но получили False.
  causes:
  - Фактическое значение не совпадает с ожидаемым.
  - Условие теста составлено неверно.
  - Проверяемый код вернул неожиданный результат.
  fixes:
  - Проверьте условие assert.
  - Посмотрите фактическое значение перед проверкой.
  - В тесте сравните ожидаемое и фактическое значения.
  - Убедитесь, что входные данные соответствуют сценарию проверки.
runtime_error:
  title: Ошибка во время выполнения
  explanation: Python обнаружил проблему во время работы программы. RuntimeError часто означает, что операция недопустима
    в текущем состоянии.
  causes:
  - Программа попала в некорректное состояние.
  - Библиотека выбросила RuntimeError по своей внутренней причине.
  - Async-операция или event loop используются неправильно.
  fixes:
  - Внимательно прочитайте полное сообщение RuntimeError.
  - Проверьте код около {file_path}:{line_number}.
  - Если используется фреймворк, убедитесь, что операция допустима в этот момент.
  - Найдите точный текст ошибки в документации библиотеки.
os_error:
  title: Ошибка операционной системы
  explanation: Python попросил операционную систему выполнить действие, но ОС не смогла его завершить.
  causes:
  - Недоступен файл, каталог, устройство, сетевой ресурс или разрешение.
  - Путь указан неверно.
  - У процесса недостаточно прав.
  fixes:
  - Посмотрите системную причину в полном сообщении.
  - Проверьте пути, права и существование ресурса.
  - Для сетевой операции проверьте соединение, хост и порт.
is_a_directory_error:
  title: Ожидался файл, но получена папка
  explanation: Python ожидал путь к файлу, однако `{path}` указывает на каталог.
  causes:
  - В функцию, ожидающую файл, передан путь к папке.
  - В пути отсутствует имя файла.
  - Переменная пути содержит неверное значение.
  fixes:
  - Передайте полный путь к файлу, а не только к каталогу.
  - Проверьте значение переменной пути.
  - Чтобы читать файлы из папки, сначала переберите её содержимое.
not_a_directory_error:
  title: Ожидалась папка, но получен файл
  explanation: Python ожидал, что часть пути будет каталогом, но обнаружил файл.
  causes:
  - Один из сегментов пути указывает на файл вместо папки.
  - Путь собран неправильно.
  - Файл и каталог имеют конфликтующие имена.
  fixes:
  - Проверьте каждую часть пути.
  - Выведите путь перед использованием.
  - Убедитесь, что родительские папки существуют и действительно являются каталогами.
eof_error:
  title: Ввод неожиданно закончился
  explanation: Python ожидал получить данные, но поток ввода завершился.
  causes:
  - input() вызван, когда ввод недоступен.
  - Программа работает в неинтерактивной среде.
  - Файл или поток закончился раньше ожидаемого.
  fixes:
  - Не вызывайте input(), если пользователь не может ввести данные.
  - Передайте данные через stdin, если скрипт их ожидает.
  - Обрабатывайте EOFError через try/except, когда ввод может отсутствовать.
connection_error:
  title: Не удалось установить сетевое соединение
  explanation: Python не смог завершить сетевое подключение.
  causes:
  - Сервер выключен или недоступен.
  - Указан неверный хост или порт.
  - Соединение блокируется или нестабильно.
  fixes:
  - Проверьте URL, хост и порт.
  - Убедитесь, что целевой сервис запущен.
  - После проверки сети повторите запрос.
  - Добавьте timeout и обработку сетевых ошибок.
timeout_error:
  title: Превышено время ожидания операции
  explanation: Операция выполнялась слишком долго, поэтому Python прекратил ожидание.
  causes:
  - Сетевой запрос выполняется слишком медленно.
  - Сервис не отвечает.
  - Операция с файлом, сокетом или процессом заблокирована.
  fixes:
  - Проверьте, доступен ли внешний сервис.
  - Увеличивайте timeout только если операция действительно должна выполняться дольше.
  - Добавьте повторные попытки, если это сетевой запрос и его безопасно повторять.
  - Обрабатывайте TimeoutError через try/except.
broken_pipe_error:
  title: Соединение через канал было разорвано
  explanation: Программа попыталась записать данные в канал или сокет, другая сторона которого уже закрыла соединение.
  causes:
  - Получатель завершил работу раньше отправителя.
  - Сетевое соединение было закрыто.
  - Вывод команды передан в программу, которая перестала его читать.
  fixes:
  - Проверьте жизненный цикл обоих процессов или соединений.
  - Корректно обрабатывайте закрытие сокета или pipe.
  - Перехватывайте BrokenPipeError, если досрочное закрытие является нормальным сценарием.
memory_error:
  title: Недостаточно оперативной памяти
  explanation: Python не смог выделить память для новой операции или объекта.
  causes:
  - В память загружается слишком большой файл или набор данных.
  - Создаётся очень большая коллекция.
  - В программе есть утечка памяти или бесконечное накопление данных.
  fixes:
  - Обрабатывайте данные небольшими частями.
  - Не загружайте огромные файлы целиком в память.
  - Проверьте код на бесконечные циклы и неконтролируемый рост списков.
  - Когда возможно, используйте генераторы или потоковую обработку.
tab_error:
  title: Смешаны табуляции и пробелы
  explanation: Python обнаружил несовместимое использование табуляций и пробелов в отступах.
  causes:
  - Часть строк выровнена Tab, а часть пробелами.
  - Редактор отображает табуляцию как несколько пробелов.
  - Код скопирован из источников с разными настройками отступов.
  fixes:
  - Преобразуйте все отступы в файле в пробелы.
  - Используйте 4 пробела на один уровень отступа.
  - Включите отображение невидимых символов в редакторе и проверьте блок около {file_path}:{line_number}.
lookup_error:
  title: Не удалось найти запрошенный элемент
  explanation: Операция поиска не нашла индекс, ключ, кодировку или другой требуемый объект.
  causes:
  - Указан отсутствующий ключ или индекс.
  - Запрошенная кодировка не поддерживается.
  - Библиотека использует LookupError как общую ошибку поиска.
  fixes:
  - Прочитайте полный текст ошибки, чтобы определить объект поиска.
  - Проверьте доступные ключи, индексы или имена.
  - Используйте более конкретную обработку KeyError, IndexError или другого подкласса.
arithmetic_error:
  title: Ошибка арифметической операции
  explanation: Python не смог выполнить математическую операцию.
  causes:
  - Произошло деление на ноль.
  - Число вышло за допустимый диапазон.
  - Включена строгая обработка ошибок вычислений с плавающей точкой.
  fixes:
  - Посмотрите конкретный подкласс ошибки в traceback.
  - Проверьте входные значения перед вычислением.
  - Добавьте проверки границ и особых значений.
overflow_error:
  title: Число слишком велико для операции
  explanation: Результат вычисления не помещается в формат, используемый функцией или внешней библиотекой.
  causes:
  - Слишком большое число передано в math-функцию.
  - Целое число преобразуется в ограниченный C-тип.
  - Экспонента или промежуточный результат слишком велики.
  fixes:
  - Проверьте диапазон входных значений.
  - Используйте масштабирование, логарифмы или Decimal при необходимости.
  - Обрабатывайте граничные значения до вызова функции.
floating_point_error:
  title: Ошибка вычисления с плавающей точкой
  explanation: Операция с float вызвала ошибку, которую библиотека настроена считать исключением.
  causes:
  - Произошло деление на ноль, переполнение или недопустимая операция.
  - NumPy настроен через seterr(..., raise).
  - В данных присутствуют NaN или бесконечности.
  fixes:
  - Проверьте данные через isfinite или numpy.isfinite.
  - Посмотрите настройки обработки ошибок NumPy.
  - Исключите нулевые делители и недопустимые значения.
reference_error:
  title: Объект слабой ссылки уже удалён
  explanation: Код обратился к proxy слабой ссылки после уничтожения исходного объекта.
  causes:
  - На объект не осталось сильных ссылок.
  - Сборщик мусора удалил объект.
  - Время жизни объекта короче, чем время жизни weakref-proxy.
  fixes:
  - Храните сильную ссылку, пока объект нужен.
  - Проверяйте результат вызова weakref перед использованием.
  - Пересмотрите управление временем жизни объектов.
environment_error:
  title: Ошибка окружения или операционной системы
  explanation: Операционная система не смогла выполнить файловую, сетевую или другую системную операцию.
  causes:
  - Ресурс отсутствует или недоступен.
  - Недостаточно прав.
  - Путь, устройство или сетевое соединение указаны неверно.
  fixes:
  - Прочитайте errno и полный текст сообщения.
  - Проверьте существование ресурса и права доступа.
  - Используйте конкретный подкласс OSError для точной обработки.
io_error:
  title: Ошибка ввода-вывода
  explanation: Не удалось выполнить операцию чтения, записи или работы с устройством.
  causes:
  - Файл или устройство недоступны.
  - Носитель повреждён или отключён.
  - Поток закрыт либо работает в неправильном режиме.
  fixes:
  - Проверьте путь, доступность устройства и права.
  - Убедитесь, что поток открыт и поддерживает нужную операцию.
  - Обработайте ошибку и не допускайте потери данных при записи.
filesystem_exists_error:
  title: Файл или папка уже существуют
  explanation: Код попытался создать ресурс, который уже существует, в режиме, запрещающем перезапись.
  causes:
  - Каталог создаётся без exist_ok=True.
  - Файл открывается в эксклюзивном режиме x.
  - Имя ресурса уже занято.
  fixes:
  - Проверьте существование пути до создания.
  - Используйте exist_ok=True, если существующий каталог допустим.
  - Выберите другое имя или явно обработайте замену файла.
process_lookup_error:
  title: Процесс не существует
  explanation: Операция адресована PID, который уже завершился или никогда не существовал.
  causes:
  - Процесс успел завершиться.
  - PID указан неверно.
  - Между проверкой и действием произошла гонка.
  fixes:
  - Проверьте состояние процесса непосредственно перед действием.
  - Обрабатывайте ProcessLookupError как возможный нормальный исход.
  - Не полагайтесь на старые PID.
child_process_error:
  title: Ошибка работы с дочерним процессом
  explanation: Операционная система не смогла выполнить запрошенное действие с дочерним процессом.
  causes:
  - У процесса нет ожидаемого дочернего процесса.
  - Результат процесса уже был получен через wait().
  - Используется неверный PID или порядок управления процессами.
  fixes:
  - Проверьте создание и завершение subprocess.
  - Не вызывайте wait или communicate повторно неподходящим способом.
  - Храните объект Popen и управляйте им через его методы.
interrupted_error:
  title: Системный вызов был прерван
  explanation: Операция ОС была прервана сигналом до завершения.
  causes:
  - Процесс получил сигнал.
  - Долгая операция чтения или ожидания была прервана.
  - Низкоуровневая библиотека не повторила системный вызов автоматически.
  fixes:
  - Повторите безопасную операцию, если это допустимо.
  - Проверьте обработчики сигналов.
  - Не игнорируйте прерывание при операциях с побочными эффектами.
blocking_io_error:
  title: Неблокирующая операция сейчас заблокировалась бы
  explanation: Ресурс работает в неблокирующем режиме и пока не готов к чтению или записи.
  causes:
  - В сокете ещё нет данных.
  - Буфер записи заполнен.
  - Файловый дескриптор используется без ожидания готовности.
  fixes:
  - Используйте select, selectors или event loop для ожидания готовности.
  - Повторите операцию позже.
  - Не превращайте неблокирующий ресурс в busy-loop.
not_implemented_error:
  title: Ветка кода не реализована
  explanation: Вызван метод или сценарий, который автор намеренно оставил без реализации.
  causes:
  - Абстрактный метод не переопределён.
  - Функция содержит временный raise NotImplementedError.
  - Текущий тип или режим пока не поддерживается.
  fixes:
  - Реализуйте метод в подклассе.
  - Не вызывайте неподдерживаемую ветку либо добавьте её реализацию.
  - Используйте abc.abstractmethod для явных абстрактных интерфейсов.
system_error:
  title: Внутренняя ошибка интерпретатора или расширения
  explanation: Python или нативное расширение обнаружили внутреннее несогласованное состояние.
  causes:
  - Ошибка находится в C-расширении.
  - Используется несовместимая версия бинарного пакета.
  - Обнаружен редкий дефект интерпретатора или библиотеки.
  fixes:
  - Обновите Python и проблемный пакет.
  - Переустановите бинарные зависимости под текущую версию Python.
  - Сведите проблему к минимальному примеру и сообщите разработчикам библиотеки.
system_exit:
  title: Программа запросила завершение
  explanation: Был вызван sys.exit() или другой механизм завершения программы.
  causes:
  - Код намеренно завершает работу.
  - CLI-библиотека завершила процесс после ошибки аргументов.
  - В библиотечном коде неожиданно вызван sys.exit().
  fixes:
  - Проверьте код выхода и сообщение перед завершением.
  - Не перехватывайте SystemExit без необходимости.
  - В библиотечном коде предпочтительнее возвращать ошибку или выбрасывать обычное исключение.
keyboard_interrupt:
  title: Выполнение прервано пользователем
  explanation: Программа получила прерывание, обычно после Ctrl+C.
  causes:
  - Пользователь остановил долгую операцию.
  - Процесс получил сигнал SIGINT.
  - В тесте или автоматизации сработало внешнее прерывание.
  fixes:
  - Корректно завершите открытые файлы и соединения через finally или context manager.
  - Не скрывайте KeyboardInterrupt без веской причины.
  - Добавьте понятное сообщение при безопасном завершении.
generator_exit:
  title: Генератор был закрыт
  explanation: Генератор получил сигнал завершения и должен прекратить выдачу значений.
  causes:
  - Вызван generator.close().
  - Генератор удалён сборщиком мусора.
  - Контекст, использующий генератор, завершился.
  fixes:
  - Освободите ресурсы в finally.
  - Не выдавайте новые значения после GeneratorExit.
  - Обычно не перехватывайте это исключение либо сразу выбрасывайте его снова.
stop_iteration:
  title: Итератор больше не содержит значений
  explanation: Итератор сообщил, что последовательность завершена.
  causes:
  - next() вызван после окончания итератора.
  - Пользовательский итератор завершил __next__.
  - StopIteration выброшен вручную в неподходящем месте.
  fixes:
  - Передайте значение по умолчанию в next(iterator, default).
  - Используйте цикл for для обычного перебора.
  - В генераторе используйте return вместо ручного raise StopIteration.
stop_async_iteration:
  title: Асинхронный итератор завершён
  explanation: Асинхронный итератор сообщил, что больше не выдаёт значения.
  causes:
  - __anext__ завершил последовательность.
  - Итератор прочитан до конца.
  - StopAsyncIteration выброшен вручную вне реализации итератора.
  fixes:
  - Используйте async for для обычного перебора.
  - Корректно реализуйте __anext__.
  - Не рассматривайте завершение итератора как ошибку приложения.
exception_group:
  title: Одновременно произошло несколько исключений
  explanation: ExceptionGroup объединяет несколько ошибок, возникших параллельно или в одной составной операции.
  causes:
  - Несколько задач TaskGroup завершились с ошибками.
  - Библиотека собрала независимые сбои в одну группу.
  - Обработан только верхний уровень, но не вложенные исключения.
  fixes:
  - Изучите все вложенные исключения в traceback.
  - Используйте except* для обработки отдельных типов.
  - Исправляйте первичные ошибки, а не только оболочку ExceptionGroup.
base_exception_group:
  title: Сгруппированы базовые исключения
  explanation: BaseExceptionGroup содержит несколько исключений, включая возможные SystemExit, KeyboardInterrupt
    или CancelledError.
  causes:
  - Параллельные задачи завершились разными типами исключений.
  - В группу попали исключения, не являющиеся обычными Exception.
  - Обработка группы выполнена слишком широко.
  fixes:
  - Просмотрите каждый вложенный элемент группы.
  - Осторожно используйте except*, не скрывая KeyboardInterrupt и SystemExit.
  - Разделяйте группу по типам и обрабатывайте только ожидаемые ошибки.
async_cancelled_error:
  title: Асинхронная задача была отменена
  explanation: Task или Future получили запрос на отмену до нормального завершения.
  causes:
  - Родительская задача или TaskGroup отменены.
  - Сработал timeout.
  - Код явно вызвал task.cancel().
  fixes:
  - Освободите ресурсы в finally.
  - После очистки обычно пробрасывайте CancelledError дальше.
  - Не используйте широкое except для случайного подавления отмены.
async_timeout_error:
  title: Асинхронная операция превысила время ожидания
  explanation: asyncio прекратил ожидание, потому что операция не завершилась за установленное время.
  causes:
  - Сетевая или файловая операция слишком медленная.
  - Задача зависла или заблокировала event loop.
  - Timeout установлен слишком маленьким.
  fixes:
  - Проверьте, где задача проводит время.
  - Не выполняйте блокирующий код напрямую в event loop.
  - Корректно обработайте timeout и отмену вложенной задачи.
subprocess_called_process_error:
  title: Внешняя команда завершилась с ошибкой
  explanation: subprocess запустил команду, которая вернула ненулевой код завершения.
  causes:
  - Команда получила неверные аргументы.
  - Внешняя программа не нашла файл или зависимость.
  - check=True превратил ненулевой код в исключение.
  fixes:
  - Посмотрите returncode, stdout и stderr команды.
  - Запустите ту же команду вручную.
  - Обрабатывайте ожидаемые коды завершения явно.
subprocess_timeout_expired:
  title: Внешняя команда не завершилась вовремя
  explanation: subprocess ожидал процесс дольше указанного timeout.
  causes:
  - Команда зависла или ждёт пользовательский ввод.
  - Операция действительно выполняется дольше лимита.
  - Дочерний процесс создал другие процессы и не завершился.
  fixes:
  - Проверьте команду вручную и исключите ожидание ввода.
  - После timeout корректно завершайте процесс и считывайте остаток вывода.
  - Увеличивайте лимит только после анализа причины.
config_parser_error:
  title: Не удалось прочитать конфигурацию ConfigParser
  explanation: Модуль configparser обнаружил неверную структуру INI-файла или ошибку доступа к данным конфигурации.
  causes:
  - Секция или параметр записаны с ошибкой.
  - В файле есть дубликаты или неверный синтаксис.
  - Код запрашивает отсутствующую секцию или настройку.
  fixes:
  - Проверьте строку и файл, указанные в сообщении.
  - Убедитесь, что заголовки секций записаны как [section].
  - Обрабатывайте отсутствующие значения через fallback или предварительную проверку.
argparse_argument_error:
  title: Некорректно определён аргумент CLI
  explanation: argparse обнаружил конфликт или неверную настройку аргумента командной строки.
  causes:
  - Одинаковая опция добавлена дважды.
  - Неверно настроены nargs, action или choices.
  - Подпарсеры или группы аргументов конфликтуют.
  fixes:
  - Проверьте add_argument для указанного аргумента.
  - Удалите дублирующиеся имена опций.
  - Сведите конфигурацию парсера к минимальному примеру.
argparse_exit:
  title: Парсер аргументов завершил программу
  explanation: argparse вызвал SystemExit после --help или из-за неверных аргументов.
  causes:
  - Пользователь запросил справку.
  - Не передан обязательный аргумент.
  - Передано недопустимое значение или неизвестная опция.
  fixes:
  - Прочитайте usage и сообщение argparse.
  - Исправьте набор аргументов команды.
  - В тестах ожидайте SystemExit или используйте подходящий тестовый runner.
dataclass_frozen_instance_error:
  title: Замороженный dataclass нельзя изменить
  explanation: Код попытался присвоить значение полю dataclass с frozen=True.
  causes:
  - Поле изменяется после создания экземпляра.
  - Метод класса пытается менять self.
  - Замороженная модель выбрана там, где нужна изменяемость.
  fixes:
  - Передайте нужные значения при создании объекта.
  - Создайте новый экземпляр через dataclasses.replace.
  - Уберите frozen=True только если объект действительно должен изменяться.
pydantic_validation_error:
  title: Данные не прошли валидацию Pydantic
  explanation: Pydantic не смог создать или проверить модель, потому что входные данные не соответствуют полям и
    типам.
  causes:
  - Обязательное поле отсутствует.
  - Значение имеет неправильный тип или формат.
  - Вложенная структура не соответствует модели.
  fixes:
  - Изучите список ошибок и loc для каждого поля.
  - Исправьте входные данные или описание модели.
  - Сделайте поле Optional или задайте default только если оно действительно необязательное.
pydantic_user_error:
  title: Некорректная конфигурация модели Pydantic
  explanation: Pydantic обнаружил ошибку в определении модели, валидатора, annotation или конфигурации.
  causes:
  - Используется устаревший API другой версии Pydantic.
  - Валидатор объявлен с неверной сигнатурой.
  - Модель содержит несовместимые annotation или настройки.
  fixes:
  - Прочитайте код ошибки и ссылку из сообщения Pydantic.
  - Проверьте, для какой версии Pydantic написан код.
  - Исправьте определение модели, а не входные данные.
django_template_does_not_exist:
  title: Шаблон Django не найден
  explanation: Django не смог найти запрошенный файл шаблона в настроенных каталогах.
  causes:
  - Имя или путь шаблона написаны неверно.
  - Папка templates имеет неправильную структуру.
  - TEMPLATES или INSTALLED_APPS настроены неверно.
  fixes:
  - Проверьте имя шаблона и структуру папок.
  - Проверьте TEMPLATES['DIRS'] и APP_DIRS в settings.py.
  - Убедитесь, что приложение с шаблонами добавлено в INSTALLED_APPS.
django_object_does_not_exist:
  title: Объект Django в базе данных не найден
  explanation: Django ORM ожидал строку базы данных, но подходящий объект отсутствует.
  causes:
  - get() вызван с фильтрами, которым ничего не соответствует.
  - Объект удалён или относится к другому пользователю или tenant.
  - В базе отсутствуют ожидаемые начальные данные.
  fixes:
  - Используйте filter().first(), если отсутствие объекта допустимо.
  - Перехватывайте DoesNotExist конкретной модели.
  - Проверьте фильтры запроса и содержимое базы.
django_model_does_not_exist:
  title: Объект модели Django не найден
  explanation: Исключение Model.DoesNotExist означает, что ORM ожидал одну строку, но запрос не нашёл подходящий
    объект.
  causes:
  - get() вызван с фильтрами без совпадений.
  - Объект был удалён или принадлежит другому пользователю или tenant.
  - В базе отсутствуют ожидаемые данные.
  fixes:
  - Используйте filter().first(), если отсутствие результата допустимо.
  - Перехватывайте Model.DoesNotExist для необязательных записей.
  - Проверьте фильтры и содержимое базы данных.
django_multiple_objects_returned:
  title: Запрос Django вернул несколько объектов
  explanation: Django ORM ожидал от get() ровно одну строку, но фильтрам соответствуют несколько записей.
  causes:
  - Фильтр недостаточно точный.
  - В базе отсутствует ограничение уникальности.
  - Существуют дублирующиеся данные.
  fixes:
  - Уточните фильтры запроса.
  - Используйте filter(), если несколько результатов допустимы.
  - Добавьте или исправьте уникальное ограничение, если запись должна быть одна.
django_integrity_error:
  title: Нарушено ограничение целостности базы Django
  explanation: База данных отклонила запись через Django ORM, потому что она нарушает ограничение схемы.
  causes:
  - Обязательное поле получило null.
  - Повторяется значение с unique-ограничением.
  - Внешний ключ указывает на отсутствующую строку.
  fixes:
  - Найдите имя ограничения в сообщении базы данных.
  - Проверяйте данные до save().
  - Сверьте миграции и фактическую схему базы.
sqlalchemy_integrity_error:
  title: Нарушено ограничение целостности базы SQLAlchemy
  explanation: База данных отклонила insert, update или delete через SQLAlchemy из-за нарушения ограничения.
  causes:
  - Уникальное значение уже существует.
  - Поле NOT NULL получило None.
  - Внешний ключ ссылается на отсутствующую запись.
  fixes:
  - Прочитайте исходную ошибку DBAPI и имя ограничения.
  - Проверяйте и удаляйте дубли до commit().
  - Сверьте модели и миграции.
sqlalchemy_programming_error:
  title: Ошибка SQL или схемы в SQLAlchemy
  explanation: SQLAlchemy отправил запрос, который база данных не смогла выполнить.
  causes:
  - Неверно указана таблица, колонка, функция или синтаксис SQL.
  - Миграции не применены.
  - Raw SQL написан для другого диалекта базы.
  fixes:
  - Изучите SQL и сообщение DBAPI в traceback.
  - Примените или пересоздайте миграции.
  - Сравните имена таблиц и колонок с реальной схемой.
sqlalchemy_no_result_found:
  title: Запрос SQLAlchemy не нашёл строку
  explanation: Запрос ожидал ровно одну строку, но результирующий набор пуст.
  causes:
  - one() или scalar_one() вызван для пустого запроса.
  - Фильтры слишком строгие или содержат неверные значения.
  - Отсутствуют ожидаемые начальные данные.
  fixes:
  - Используйте one_or_none(), если отсутствие строки допустимо.
  - Проверьте фильтры и данные в базе.
  - Явно обработайте сценарий отсутствующей записи.
sqlalchemy_multiple_results_found:
  title: Запрос SQLAlchemy вернул несколько строк
  explanation: Запрос ожидал одну строку, но условиям соответствуют несколько записей.
  causes:
  - one() или scalar_one() используется с неуникальными фильтрами.
  - В базе есть дубли.
  - В модели отсутствует ограничение уникальности.
  fixes:
  - Уточните фильтры либо используйте order/limit, когда это корректно.
  - Используйте all(), если несколько строк допустимы.
  - Добавьте уникальное ограничение, если модель требует один результат.
requests_connection_error:
  title: requests не смог установить соединение
  explanation: Библиотека requests не смогла открыть или сохранить сетевое соединение.
  causes:
  - Хост недоступен или URL неверен.
  - Возникла проблема DNS, proxy, firewall или TLS.
  - Удалённый сервис не работает.
  fixes:
  - Проверьте URL и сетевое соединение.
  - Откройте тот же URL через curl или браузер.
  - Укажите timeout и добавьте безопасные повторные попытки для внешних сервисов.
requests_timeout:
  title: requests превысил время ожидания
  explanation: Библиотека requests слишком долго ожидала соединение или данные ответа.
  causes:
  - Сервер работает медленно или недоступен.
  - Значение timeout слишком маленькое.
  - Proxy или сетевой маршрут задерживают трафик.
  fixes:
  - Проверьте нормальную скорость ответа сервиса.
  - При необходимости задайте отдельные connect и read timeout.
  - Добавляйте retry/backoff только для безопасных идемпотентных запросов.
requests_http_error:
  title: HTTP-запрос вернул ошибочный статус
  explanation: requests выбросил HTTPError, потому что raise_for_status() получил ответ 4xx или 5xx.
  causes:
  - В запросе неверны URL, заголовки, авторизация или тело.
  - Сервер вернул внутреннюю ошибку приложения.
  - Endpoint требует другие параметры или права.
  fixes:
  - Посмотрите response.status_code и response.text.
  - Проверьте авторизацию, тело запроса и путь endpoint.
  - Обрабатывайте ожидаемые ответы 4xx как бизнес-сценарий, а не как падение программы.
urllib_url_error:
  title: Запрос urllib не выполнен
  explanation: urllib не смог завершить запрос по URL.
  causes:
  - Ошибка в URL, DNS, proxy или сетевом соединении.
  - Не прошла проверка TLS-сертификата.
  - Удалённый сервер недоступен.
  fixes:
  - Проверьте URL и сетевой маршрут.
  - Изучите атрибут reason у исключения.
  - Задайте явный timeout и обрабатывайте сетевые сбои.
urllib_http_error:
  title: urllib получил ошибочный HTTP-статус
  explanation: Сервер вернул urllib ответ с ошибкой HTTP.
  causes:
  - Endpoint вернул статус 4xx или 5xx.
  - Неверны заголовки, авторизация, тело или HTTP-метод.
  - Сервер отклонил запрос.
  fixes:
  - Проверьте код статуса и тело ответа.
  - Проверьте авторизацию, заголовки, метод и URL.
  - Явно обрабатывайте ожидаемые HTTP-ошибки.
numpy_axis_error:
  title: Ось NumPy выходит за границы массива
  explanation: NumPy получил номер оси, которой нет у массива с текущим количеством измерений.
  causes:
  - У массива меньше измерений, чем ожидалось.
  - Номер axis отрицательный или слишком большой.
  - Данные были squeeze, flatten или загружены с неожиданной shape.
  fixes:
  - Выведите array.shape перед операцией.
  - Используйте axis, допустимый для реального числа измерений.
  - Нормализуйте форму входных данных до вычислений.
pandas_key_error:
  title: В Pandas отсутствует колонка или индекс
  explanation: Pandas не нашёл запрошенное имя колонки, метку индекса или уровень.
  causes:
  - Имя колонки написано с ошибкой.
  - CSV или API вернули другие заголовки.
  - Индекс не настроен на метки, к которым обращается код.
  fixes:
  - Выведите df.columns и df.index.
  - Удалите лишние пробелы в именах колонок после чтения CSV.
  - Используйте df.get или проверку membership, если колонка необязательная.
pandas_parser_error:
  title: Pandas не смог разобрать входные данные
  explanation: Pandas завершился ошибкой при чтении CSV или другого структурированного файла.
  causes:
  - В строках разное количество колонок.
  - Неверно указаны разделитель, кавычки или кодировка.
  - Файл повреждён либо имеет другой формат.
  fixes:
  - Проверьте файл около строки, указанной в ошибке.
  - Передайте правильные sep, quotechar, encoding или engine.
  - Посмотрите исходный файл до попытки читать его как CSV.
pytest_failed_assertion:
  title: Проверка pytest завершилась неудачно
  explanation: pytest сообщил о неуспешном assert или явном вызове pytest.fail().
  causes:
  - Фактическое поведение отличается от ожидаемого.
  - Ожидаемое значение в тесте устарело или неверно.
  - Fixture или входные данные не соответствуют сценарию.
  fixes:
  - Прочитайте diff значений в выводе pytest.
  - Сравните actual и expected.
  - Исправьте реализацию либо ожидание теста, если требования действительно изменились.
pytest_skipped:
  title: pytest пропустил тест
  explanation: pytest не запустил тест из-за условия skip или отсутствующей зависимости.
  causes:
  - Использован pytest.skip или marker skip.
  - Не выполнено условие платформы, версии или зависимости.
  - Fixture пропустила тест во время setup.
  fixes:
  - Прочитайте причину skip в выводе pytest.
  - Установите необязательные зависимости, если тест должен выполняться.
  - Меняйте условие skip только если оно больше не соответствует требованиям проекта.
click_exception:
  title: Команда Click завершилась с ошибкой
  explanation: CLI на базе Click выбросил понятную пользователю ошибку команды.
  causes:
  - Аргументы или опции команды недопустимы.
  - Callback команды вызвал ClickException.
  - В окружении отсутствуют нужные файлы или настройки.
  fixes:
  - Запустите команду с --help.
  - Проверьте имена опций, значения аргументов и рабочую папку.
  - Прочитайте точное сообщение ClickException.
typer_bad_parameter:
  title: Параметр Typer/Click имеет неверное значение
  explanation: Команда Typer или Click получила аргумент, который не прошёл проверку.
  causes:
  - Значение имеет неверный тип или формат.
  - Опция файла или пути указывает на недопустимое место.
  - Пользовательский callback отклонил значение.
  fixes:
  - Запустите команду с --help.
  - Проверьте ожидаемый тип и список допустимых значений.
  - В тестах проверьте, как CliRunner передаёт аргументы.
flask_bad_request:
  title: Flask/Werkzeug отклонил запрос
  explanation: Flask или Werkzeug посчитали входные данные HTTP-запроса некорректными.
  causes:
  - JSON, form-data, query-параметры или заголовки имеют неверный формат.
  - Код строго обращается к отсутствующим данным запроса.
  - Клиент отправил запрос, не соответствующий endpoint.
  fixes:
  - Проверьте тело и заголовки входящего запроса.
  - Используйте request.get_json(silent=True) или валидацию для необязательных данных.
  - Возвращайте понятный ответ 400 для некорректного ввода клиента.
jwt_decode_error:
  title: JWT-токен не удалось декодировать
  explanation: PyJWT не смог разобрать переданный токен.
  causes:
  - Токен повреждён или имеет неверный формат.
  - Алгоритм подписи или secret/key не совпадают.
  - Вместо JWT передано другое значение.
  fixes:
  - Проверьте наличие трёх сегментов JWT.
  - Проверьте алгоритм и секретный или публичный ключ.
  - Не доверяйте пользовательскому токену без валидации и обработки ошибок.
jwt_expired_signature:
  title: Срок действия JWT истёк
  explanation: PyJWT отклонил токен, потому что значение exp уже находится в прошлом.
  causes:
  - Клиент использует старый токен.
  - Часы сервера или клиента настроены неверно.
  - Время жизни токена слишком мало для сценария.
  fixes:
  - Выпустите новый токен или используйте refresh-token flow.
  - Проверьте системное время.
  - Возвращайте понятный ответ аутентификации для истёкших токенов.
yaml_error:
  title: Не удалось разобрать YAML
  explanation: PyYAML обнаружил некорректный YAML-файл или строку.
  causes:
  - Неверные отступы.
  - Некорректно записаны двоеточие, кавычки, маркер списка или многострочный блок.
  - Файл на самом деле имеет другой формат.
  fixes:
  - Проверьте строку и колонку из сообщения.
  - Проверьте отступы и кавычки.
  - Используйте safe_load, если другой loader не требуется осознанно.
toml_decode_error:
  title: Не удалось разобрать TOML
  explanation: Python обнаружил синтаксическую ошибку в TOML-конфигурации.
  causes:
  - Синтаксис TOML неверен.
  - Некорректно записаны строка, массив, таблица или ключ.
  - В файле используется синтаксис JSON или YAML вместо TOML.
  fixes:
  - Проверьте указанную строку и колонку.
  - Проверьте заголовки таблиц, кавычки, массивы и дубли ключей.
  - Сравните pyproject.toml с минимальным корректным примером.
importlib_metadata_package_not_found:
  title: Метаданные установленного пакета не найдены
  explanation: importlib.metadata не смог найти метаданные запрошенного distribution-пакета.
  causes:
  - Пакет не установлен в активном окружении.
  - Имя distribution отличается от имени импорта.
  - Код проверяет метаданные до установки зависимостей.
  fixes:
  - Установите distribution-пакет в активное окружение.
  - Проверьте имя пакета для pip, а не только имя импорта.
  - Выполните python -m pip show <package> тем же интерпретатором.
django_improperly_configured:
  title: Конфигурация Django некорректна
  explanation: Django не смог запуститься из-за неверной настройки settings, приложения, middleware, шаблонов, базы
    данных или переменной окружения.
  causes:
  - DJANGO_SETTINGS_MODULE отсутствует или указывает не на тот модуль.
  - Не задана обязательная переменная окружения.
  - INSTALLED_APPS, MIDDLEWARE, DATABASES или TEMPLATES содержат неверное значение.
  - Не установлен пакет, используемый в settings.
  fixes:
  - Проверьте settings.py и точный текст ошибки.
  - Проверьте DJANGO_SETTINGS_MODULE и переменные окружения.
  - Проверьте записи INSTALLED_APPS и MIDDLEWARE.
  - Запускайте команду из корня Django-проекта с manage.py.
django_no_reverse_match:
  title: Django не смог построить URL
  explanation: Django попытался выполнить reverse URL по имени, но не нашёл подходящий pattern либо не получил обязательные
    параметры.
  causes:
  - Имя URL написано неверно.
  - Namespace приложения отсутствует или указан неправильно.
  - URL требует аргументы, которые не были переданы.
  - urls.py приложения не подключён к корневому urls.py.
  fixes:
  - Проверьте значение name= в path() или re_path().
  - Проверьте app_name и namespace.
  - Передайте нужные args или kwargs в reverse(), redirect() или тег url.
  - Убедитесь, что urls.py приложения подключён в корневом urls.py.
fastapi_response_validation_error:
  title: Ответ FastAPI не соответствует response_model
  explanation: FastAPI проверил возвращаемые данные по response_model и обнаружил несовпадение со схемой.
  causes:
  - Endpoint не возвращает обязательные поля.
  - Значения имеют неверные типы.
  - response_model строже, чем фактические данные.
  fixes:
  - Проверьте значение, возвращаемое endpoint.
  - Проверьте поля и типы response_model.
  - Сделайте поле Optional или задайте default только когда это корректно.
  - Возвращайте данные, соответствующие модели Pydantic.
sqlalchemy_operational_error:
  title: Не выполнена операция или подключение SQLAlchemy
  explanation: 'SQLAlchemy не смог завершить операцию с базой. Частые причины: URL, сеть, сервер, credentials или
    неприменённые миграции.'
  causes:
  - Сервер базы данных не запущен.
  - DATABASE_URL указан неверно.
  - База или таблица не существует.
  - Миграции не применены.
  fixes:
  - Проверьте DATABASE_URL и переменные окружения.
  - Убедитесь, что сервер базы запущен.
  - Примените миграции Alembic, если схема отсутствует.
  - Посмотрите исходную ошибку DBAPI внутри traceback.
django_command_error:
  title: Команда управления Django завершилась с ошибкой
  explanation: Django остановил management-команду из-за неверных аргументов, конфигурации или состояния проекта.
  causes:
  - Неверно указано имя команды или одна из опций.
  - Settings или установленные приложения загружены неправильно.
  - Пользовательская management-команда намеренно вызвала CommandError.
  fixes:
  - Прочитайте сообщение и проверьте синтаксис через python manage.py help.
  - Запускайте команду из папки с manage.py либо правильно задайте DJANGO_SETTINGS_MODULE.
  - Для пользовательской команды найдите место, где выбрасывается CommandError.
alembic_command_error:
  title: Команда миграции Alembic завершилась с ошибкой
  explanation: Alembic не смог выполнить команду миграции. Обычно история ревизий, файлы миграций или состояние
    базы не согласованы.
  causes:
  - Отсутствует идентификатор ревизии.
  - База не обновлена до ожидаемой ревизии.
  - alembic.ini или env.py настроены неверно.
  fixes:
  - Выполните alembic current для проверки текущей ревизии БД.
  - Выполните alembic history для просмотра доступных ревизий.
  - Выполните alembic upgrade head, если база отстаёт.
  - Проверьте alembic.ini и migrations/env.py.
pytest_fixture_lookup_error:
  title: Фикстура pytest не найдена
  explanation: pytest не смог найти запрошенную fixture.
  causes:
  - Имя fixture написано с ошибкой.
  - Fixture не определена в тесте или conftest.py.
  - Fixture предоставляется неустановленным или отключённым plugin.
  fixes:
  - Проверьте имя fixture.
  - Определите её в тестовом файле или conftest.py.
  - Проверьте установленные pytest plugins.
  - Выполните pytest --fixtures для списка доступных фикстур.
aiogram_telegram_bad_request:
  title: Telegram отклонил запрос aiogram как некорректный
  explanation: Telegram API отклонил запрос aiogram из-за неверных данных.
  causes:
  - Некорректны chat_id, message_id, callback data, markup или текст.
  - Бот пытается изменить, удалить или отправить объект запрещённым способом.
  - HTML или Markdown-разметка повреждена.
  fixes:
  - Прочитайте точное описание Telegram в сообщении.
  - Проверьте chat_id, message_id и reply_markup.
  - Проверьте форматирование parse_mode.
  - Обрабатывайте TelegramBadRequest через try/except, если действие может не выполниться.
pytelegrambotapi_api_exception:
  title: Ошибка Telegram API в pyTelegramBotAPI
  explanation: Telegram вернул ошибку API при вызове метода бота через pyTelegramBotAPI.
  causes:
  - Некорректны token, chat_id, message_id, parse mode или reply markup.
  - Telegram отклонил запрошенное действие.
  - У бота нет прав на чат или операцию.
  fixes:
  - Прочитайте код и описание ошибки Telegram.
  - Проверьте токен и права бота.
  - Проверьте parse_mode и reply_markup.
  - Оберните потенциально неуспешные вызовы Telegram в try/except.
