[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termdoctor"
version = "0.1.1"
description = "A CLI tool that explains Python terminal errors and suggests practical fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "notimechoki" }
]
keywords = [
    "cli",
    "terminal",
    "python",
    "debugging",
    "traceback",
    "developer-tools"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
termdoctor = "termdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/notimechoki/termdoctor"
Repository = "https://github.com/notimechoki/termdoctor"
Issues = "https://github.com/notimechoki/termdoctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termdoctor = ["rules/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]